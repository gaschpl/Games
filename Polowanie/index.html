<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#172014" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Polowanie" />
  <link rel="manifest" href="manifest.json" />
  <title>Strzelanina na Łące w Tucznie u Taty i Zosi v142</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🌿%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css?v=142" />
</head>
<body>
  <canvas id="game" aria-label="Strzelanina na Łące w Tucznie u Taty i Zosi. Dwóch graczy. Gracz 1: WASD, E, spacja. Gracz 2: pad, drążek, A, X albo RT."></canvas>
  <div class="vignette" aria-hidden="true"></div>
  <div class="hud">
    <p class="title">Strzelanina na Łące w Tucznie u Taty i Zosi v142</p>
    <p class="score" id="score">Gracz 1: 0 gold<br />Gracz 2: 0 gold</p>
    <p class="fps" id="fps">FPS —</p>
    <p class="hint" id="hint">Gracz 1: WASD, E, spacja<br />Gracz 2: pad — drążek, A, X albo RT<br />Dwa jednorożce · gold</p>
    <label class="scale" for="scale"><span id="scale-label">Skala obrazu</span>
      <input id="scale" type="range" min="1" max="8" step="1" value="1" />
    </label>
    <div class="hud-buttons">
      <button type="button" id="music" class="music" aria-pressed="true">Muzyka: włączona</button>
      <button type="button" id="boars-toggle" class="music" aria-pressed="true">Dziki: włączone</button>
      <button type="button" id="net-log-btn" class="music" aria-pressed="false" title="Komunikaty połączenia">ℹ</button>
      <button type="button" id="save-game" class="music" title="Zapisz na tym urządzeniu">Zapis</button>
      <button type="button" id="kick-2" class="music" hidden>✖2</button>
      <button type="button" id="kick-3" class="music" hidden>✖3</button>
    </div>
    <div id="save-pick" hidden>
      <button type="button" data-slot="0">1</button>
      <button type="button" data-slot="1">2</button>
      <button type="button" data-slot="2">3</button>
    </div>
  </div>
  <div id="net-log"></div>
  <p class="banner" id="banner" hidden>Poziom 2</p>
  <div class="loading" id="loading" hidden>
    <p class="menu-title">Wczytywanie</p>
    <div class="load-track"><div class="load-bar" id="load-bar"></div></div>
    <p class="menu-note" id="load-label">0%</p>
  </div>
  <div class="menu" id="menu">
    <p class="menu-title">Mapa</p>
    <div class="choice-row">
      <button type="button" id="map-old">Stara mapa</button>
      <button type="button" id="map-tuczno" class="picked">Tuczno</button>
      <button type="button" id="map-plewiska">Plewiska</button>
      <button type="button" id="map-sehnde">Sehnde</button>
      <button type="button" id="map-poznan">Poznań</button>
    </div>
    <p class="menu-title">Tryb</p>
    <div class="choice-row" id="modes">
      <button type="button" id="mode-solo">Jednoosobowa</button>
      <button type="button" id="mode-split">Dzielony ekran</button>
      <button type="button" id="mode-host">Utwórz grę sieciową</button>
      <button type="button" id="mode-join">Dołącz do gry</button>
    </div>
    <div id="continue-slots"></div>
    <div id="setup" hidden>
      <button type="button" id="play">Graj</button>
      <div id="broker-choice" hidden>
        <p class="menu-title set-title">Serwer</p>
        <div class="choice-row">
          <button type="button" id="broker-hivemq" class="picked">HiveMQ</button>
          <button type="button" id="broker-emqx">EMQX</button>
          <button type="button" id="broker-webrtc">WebRTC lokalnie</button>
          <button type="button" id="broker-local">Ten komputer</button>
        </div>
        <input id="broker-addr" class="net-code" placeholder="192.168.104.10" hidden />
      </div>
      <p class="menu-title set-title">Ustawienia</p>
      <div class="sets">
    <label class="set">Bieg <span id="run-v">76</span>
      <input id="set-run" type="range" min="40" max="160" step="2" value="76" />
    </label>
    <label class="set">Energia gracza <span id="energy-v">100</span>
      <input id="set-energy" type="range" min="20" max="300" step="10" value="100" />
    </label>
    <label class="set">Energia dzika <span id="boar-energy-v">100</span>
      <input id="set-boar-energy" type="range" min="20" max="300" step="10" value="100" />
    </label>
    <label class="set">Obrażenia dzika <span id="boar-dmg-v">10</span>
      <input id="set-boar-dmg" type="range" min="1" max="40" step="1" value="10" />
    </label>
    <label class="set">Kuchenka, % na sekundę <span id="regen-v">1</span>
      <input id="set-regen" type="range" min="1" max="20" step="1" value="1" />
    </label>
    <label class="set">Powrót zwierząt, sekundy <span id="return-v">120</span>
      <input id="set-return" type="range" min="10" max="300" step="10" value="120" />
    </label>
    <label class="set">Motyle <span id="flies-v">72</span>
      <input id="set-flies" type="range" min="0" max="150" step="1" value="72" />
    </label>
    <label class="set">Stawy <span id="ponds-v">3</span>
      <input id="set-ponds" type="range" min="1" max="8" step="1" value="3" />
    </label>
    <label class="set">Kaczki na stawek <span id="ducks-v">2</span>
      <input id="set-ducks" type="range" min="0" max="6" step="1" value="2" />
    </label>
    <label class="set">Dziki <span id="boars-v">8</span>
      <input id="set-boars" type="range" min="0" max="30" step="1" value="8" />
    </label>
    <label class="set">Lisy <span id="foxes-v">30</span>
      <input id="set-foxes" type="range" min="0" max="60" step="1" value="30" />
    </label>
    <label class="set">Wiewiórki <span id="squirrels-v">30</span>
      <input id="set-squirrels" type="range" min="0" max="60" step="1" value="30" />
    </label>
    <label class="set">Sarny <span id="deer-v">30</span>
      <input id="set-deer" type="range" min="0" max="60" step="1" value="30" />
    </label>
    <label class="set">Ptaki <span id="birds-v">30</span>
      <input id="set-birds" type="range" min="0" max="60" step="1" value="30" />
    </label>
    </div>
    </div>
    <div id="join-box" hidden>
      <p class="menu-title set-title">Serwer</p>
      <div class="choice-row">
        <button type="button" id="join-broker-hivemq" class="picked">HiveMQ</button>
        <button type="button" id="join-broker-emqx">EMQX</button>
        <button type="button" id="join-broker-webrtc">WebRTC lokalnie</button>
        <button type="button" id="join-broker-local">Ten komputer</button>
      </div>
      <input id="join-broker-addr" class="net-code" placeholder="192.168.104.10" hidden />
      <input id="net-code-input" class="net-code" maxlength="4" placeholder="KOD" autocomplete="off" />
      <button type="button" id="net-join">Dołącz</button>
    </div>
  </div>
  <div id="touch" hidden>
    <div id="stick" class="stick"><div id="stick-knob"></div></div>
    <div class="touch-actions">
      <button type="button" id="touch-run">Bieg</button>
      <button type="button" id="touch-act">Akcja</button>
      <button type="button" id="touch-weapon">Broń</button>
      <button type="button" id="touch-fire">Atak</button>
    </div>
  </div>
  <div id="turn" hidden>Obróć telefon w poziom</div>
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <script src="https://unpkg.com/mqtt@5.10.4/dist/mqtt.min.js"></script>
  <script src="js/tuczno-map.js?v=114"></script>
  <script src="js/plewiska-map.js?v=114"></script>
  <script src="js/sehnde-map.js?v=114"></script>
  <script src="js/poznan-map.js?v=114"></script>
  <script src="js/game.js?v=142"></script>
</body>
</html>
